name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/execution-spike/uv.lock

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Type-check JavaScript workspace
        run: pnpm typecheck

      - name: Test JavaScript workspace
        run: pnpm test

      - name: Build JavaScript workspace
        run: pnpm build

      - name: Test Go API
        working-directory: apps/api
        run: go test ./...

      - name: Install execution-spike dependencies
        run: uv sync --project tools/execution-spike --frozen

      - name: Test execution-spike unit suite
        run: uv run --project tools/execution-spike --frozen python -m unittest discover -s tools/execution-spike/tests -v

      - name: Validate canonical execution manifest
        run: uv run --project tools/execution-spike --frozen python tools/execution-spike/dioffice_spike.py validate --manifest examples/execution-manifest.react-pnpm.json

      - name: Validate Compose configuration
        run: docker compose config --quiet
