name: dioffice

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: dioffice
      POSTGRES_USER: ${POSTGRES_USER:-dioffice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dioffice-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dioffice} -d dioffice"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dioffice_postgres:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:latest@sha256:9be7b8d98f60d00f4f2ff74731c071a17848d8182bbc8429e314a24c94ea105b
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dioffice}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-dioffice-dev-only}
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  s3mock:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-dioffice}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dioffice_s3mock:/s3mockroot

volumes:
  dioffice_postgres:
  dioffice_s3mock:
